<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>table practice 3</title>
    <style>
        table {
            width: 100%;
            border-collapse: collapse; /* 테두리 겹치게 설정*/
        }
        th {
            background-color: rgb(199, 234, 161);
        }
        th,
        td {
            border: 1px, solid black;
            padding: 8px;
            text-align: center;
        }
    </style>
</head>
<body>
    <h1>테이블 공부 예제</h1>
    <h2>브랜드 테이블</h2>
    <table>
        <caption>브랜드 표</caption>
        <thead>
            <tr>
                <th scope="col" colspan="6">브랜드</th>
            </tr>
        </thead>
        <tbody>
            <tr>
                <th >애플</th>
            </tr>
        </tbody>
    </table>
</body>
</html>
