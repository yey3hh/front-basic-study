<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>table practice 1</title>
    <style>
      table {
        width: 100%;
        border-collapse: collapse; /* 테두리 겹치게 설정*/
      }
      th {
        background-color: rgb(199, 234, 161);
      }
      th,
      td {
        border: 1px, solid black;
        padding: 8px;
        text-align: center;
      }
    </style>
</head>
<body>
    <h1>시간표 예제</h1>
    <table>
        <caption>HTML TABLE 시간표 기본 예제</caption>
        <thead>
            <tr>
                <th scope="col"></th>
                <th scope="col">월</th>
                <th scope="col">화</th>
                <th scope="col">수</th>
                <th scope="col">목</th>
                <th scope="col">금</th>
            </tr>
        </thead>
        <tbody>
            <tr>
                <th scope="row">1교시</th>
                <td>영어</td>
                <td>국어</td>
                <td>과학</td>
                <td>미술</td>
                <td>기술</td>
            </tr>
            <tr>
                <th scope="row">2교시</th>
                <td>도덕</td>
                <td>체육</td>
                <td>영어</td>
                <td>수학</td>
                <td>사회</td>
            </tr>
        </tbody>
    </table>
</body>
</html>
