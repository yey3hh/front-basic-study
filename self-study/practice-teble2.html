<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>table practice 2</title>
    <style>
      table {
        width: 100%;
        border-collapse: collapse; /* 테두리 겹치게 설정*/
      }
      th {
        background-color: rgb(199, 234, 161);
      }
      th,
      td {
        border: 1px, solid black;
        padding: 8px;
        text-align: center;
      }
    </style>
  </head>
  <body>
    <h1>지역별 홍차 테이블 연습</h1>
    <table>
      <caption>
        HTML TABLE 예제
      </caption>
      <thead>
        <tr>
          <th scope="col" colspan="2">지역별 홍차</th>
        </tr>
      </thead>
      <tbody>
        <tr>
          <th scope="row" rowspan="3">중국</th>
          <td>정산소종</td>
        </tr>
        <tr>
          <td>기문</td>
        </tr>
        <tr>
          <td>운남</td>
        </tr>
        <tr>
          <th scope="row" rowspan="4">인도 및 스리랑카</th>
          <td>아삼</td>
        </tr>
        <tr>
          <td>실론</td>
        </tr>
        <tr>
          <td>다질링</td>
        </tr>
        <tr>
          <td>닐기리</td>
        </tr>

      </tbody>
    </table>
  </body>
</html>
